name: Windows build & release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract bootstrap source and publish readable files
        shell: pwsh
        run: |
          if (Test-Path 'bootstrap/source.zip') {
            Expand-Archive 'bootstrap/source.zip' -DestinationPath . -Force
            Remove-Item -Recurse -Force bootstrap
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git config user.name 'github-actions[bot]'
            git add -A
            git commit -m 'chore: unpack Baodroid source files'
            git push origin HEAD:main
          }
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Verify JS syntax
        run: npm run check
      - name: Build Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            npm run release:win
          } else {
            npm run dist:win
          }
        shell: pwsh
      - name: Upload Windows setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: Baodroid-Windows-Setup
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
