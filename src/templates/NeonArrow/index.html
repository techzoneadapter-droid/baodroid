<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/><title>Neon Arrow | Puzzle Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090e20;color:#eff5ff;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}main{max-width:550px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#7de7e2;letter-spacing:1px}.top b{font-size:21px;color:#f5f7ff}.hero{margin:20px 0 15px;padding:22px;border-radius:25px;background:linear-gradient(130deg,#52368f,#184d70);box-shadow:0 15px 40px #0005}.hero h1{font-size:29px;margin:0 0 10px}.hero p{font-size:13px;color:#d9e6ff;line-height:1.5}.stats{display:flex;justify-content:space-between;margin-top:22px}.stat small{display:block;color:#bed7ee;font-size:10px}.stat b{font-size:23px}.switch{display:flex;gap:9px;margin:14px 0}.switch button{flex:1}.board-card{background:#111a34;border:1px solid #334272;border-radius:23px;padding:15px}.board-head{display:flex;justify-content:space-between;font-weight:800;font-size:13px;padding-bottom:15px}.board{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;aspect-ratio:1;background:#0c152c;padding:4px;border-radius:15px}.cell{border:1px solid #29395f;display:flex;align-items:center;justify-content:center;min-width:0;border-radius:8px;aspect-ratio:1;background:transparent;cursor:pointer;color:white;font-size:clamp(17px,5vw,30px);font-weight:900;touch-action:manipulation}.cell.filled{background:linear-gradient(135deg,#29b4dc,#8566f2);box-shadow:0 4px 15px #2d85bb55}.cell.good{outline:3px solid #8dffc4}.cell.bad{animation:wrong .22s 2}@keyframes wrong{50%{background:#e9537d}}.actions{display:flex;gap:9px;margin-top:15px}button{border:0;border-radius:14px;padding:13px 14px;background:#29375d;color:#fff;font-weight:800;cursor:pointer}.actions button{flex:1}.primary,.switch button.active{background:#815cf0}.footer{font-size:11px;text-align:center;margin-top:24px;color:#9caed1}.win{margin-top:15px;border-radius:16px;background:#14584e;padding:18px}.win button{display:block;width:100%;margin-top:12px;background:#cafbea;color:#055244}.meta{margin-top:13px;color:#9caed1;display:flex;justify-content:space-between;font-size:12px}
</style></head><body><main><div class="top"><b>ϟ NEON ARROW</b><span>PUZZLE LAB</span></div>
<section class="hero"><h1>Find a way out.</h1><p>Tap an arrow only when its route to the edge is clear. Clear the board to win!</p><div class="stats"><div class="stat"><small>LEVEL</small><b id="level">1</b></div><div class="stat"><small>BEST</small><b id="best">0</b></div><div class="stat"><small>TIME</small><b id="time">0:00</b></div></div></section>
<div class="switch"><button class="active" id="classic">✦ Classic</button><button id="daily">☀ Daily Challenge</button></div>
<section class="board-card"><div class="board-head"><span id="board-label">BOARD 01</span><span id="remaining">0 LEFT</span></div><div id="board" class="board" aria-label="Arrow puzzle board"></div><div class="meta"><span id="moves">MOVES 0</span><span id="miss">BLOCKED 0</span></div></section>
<div id="end" hidden></div><div class="actions"><button id="hint">✧ Show hint</button><button id="restart">↻ Restart</button></div>
<p class="footer">Gameplay prototype • No paid ads • Offline-ready • Source editable in VS Code</p></main>
<script>
(function(){
const N=6, dirs=[[0,-1],[1,0],[0,1],[-1,0]],arr=['↑','→','↓','←'];
let level=1,mode='classic',board=[],moves=0,miss=0,seconds=0,done=false;
let best=Number(localStorage.getItem('neon-best')||0);
const $=id=>document.getElementById(id);
const idx=(x,y)=>y*N+x;
function pathFree(b,i,d){let x=i%N,y=Math.floor(i/N);while(true){x+=dirs[d][0];y+=dirs[d][1];if(x<0||y<0||x>=N||y>=N)return true;if(b[idx(x,y)]!==null)return false;}}
function shuffle(items){for(let i=items.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}return items;}
function generate(){const b=Array(36).fill(null),cells=shuffle(Array.from({length:36},(_,i)=>i));for(const i of cells){const valid=shuffle([0,1,2,3]).filter(d=>pathFree(b,i,d));if(valid.length)b[i]=valid[0];}return b;}
function sync(){ $('level').textContent=level;$('best').textContent=best;$('remaining').textContent=board.filter(v=>v!==null).length+' LEFT';$('moves').textContent='MOVES '+moves;$('miss').textContent='BLOCKED '+miss;$('board-label').textContent=mode==='daily'?'DAILY PUZZLE':'BOARD '+String(level).padStart(2,'0');$('classic').classList.toggle('active',mode==='classic');$('daily').classList.toggle('active',mode==='daily'); }
function render(){const grid=$('board');grid.replaceChildren();for(let i=0;i<board.length;i++){const b=document.createElement('button');b.className='cell'+(board[i]===null?'':' filled');b.textContent=board[i]===null?'':arr[board[i]];b.setAttribute('aria-label','Cell '+(i+1));b.onclick=()=>tap(i,b);grid.appendChild(b);}sync();}
function start(nextLevel=level,nextMode=mode){level=nextLevel;mode=nextMode;board=generate();moves=0;miss=0;seconds=0;done=false;$('end').hidden=true;render();}
function tap(i,el){if(done||board[i]===null)return;if(!pathFree(board,i,board[i])){miss++;el.classList.add('bad');setTimeout(()=>el.classList.remove('bad'),500);sync();return;}board[i]=null;moves++;if(board.every(v=>v===null)){done=true;if(mode==='classic'&&level>best){best=level;localStorage.setItem('neon-best',String(best));}$('end').hidden=false;$('end').className='win';$('end').innerHTML='<b>✦ LEVEL CLEARED!</b><p>Ready for your next puzzle?</p><button id="next">Next level →</button>';$('next').onclick=()=>start(mode==='classic'?level+1:level,mode);}render();}
$('classic').onclick=()=>start(level,'classic');$('daily').onclick=()=>start(1,'daily');$('restart').onclick=()=>start();$('hint').onclick=()=>{for(let i=0;i<board.length;i++)if(board[i]!==null&&pathFree(board,i,board[i])){$('board').children[i].classList.add('good');setTimeout(()=>$('board').children[i]?.classList.remove('good'),1200);break;}};
setInterval(()=>{if(done)return;seconds++;$('time').textContent=Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');},1000);start();
})();
</script></body></html>
